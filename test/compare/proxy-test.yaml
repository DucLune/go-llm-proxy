# go-llm-proxy PDF-compare test instance config.
# Generated by the comparison test suite — backend points at the local mock
# OpenAI server so no real upstream call is made. Uses port 8788 to avoid
# clashing with the production instance on 8787.
listen: "127.0.0.1:8788"

models:
  - name: test-pdf-model
    backend: http://127.0.0.1:18887
    api_key: mock-key

# Not used by sample.pdf (native text → Stage 1), but kept so the config
# schema and startup validation mirror the production setup.
processors:
  vision: test-pdf-model
  vision_max_tokens: 64000
  max_images_per_request: 100

# Local API key, same value as production config for the test request.
keys:
  - key: sk-local-dev-9f3a2c
    name: test

# Quiet logging; details go to the mock's captured jsonl instead.
log:
  level: warn
  file: out/compare/proxy-test.log
  max_size_mb: 10
  max_backups: 1
  compress: false
